<!doctype html>
<html lang="zh-CN" data-base=".">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="五等分的zako——记录设计、技术、生活与持续发生的灵感。" />
    <meta name="theme-color" content="#f6f6f1" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="五等分的zako" />
    <meta property="og:description" content="一个关于设计、技术与数字生活的个人博客。" />
    <meta property="og:image" content="https://zako00001.github.io/http-zako/og.png" />
    <link rel="canonical" href="https://zako00001.github.io/http-zako/" />
    <link rel="alternate" type="application/rss+xml" title="五等分的zako RSS" href="./rss.xml" />
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>五等分的zako｜个人博客</title>
  </head>
  <body data-page="home">
    <div class="site-backdrop" aria-hidden="true"><span></span><span></span><span></span></div>
    <header id="site-header"></header>
    <main>
      <section class="home-hero page-width">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <div class="hero-layout">
          <h1 id="hero-title"></h1>
          <div class="hero-intro-wrap">
            <p id="hero-intro"></p>
            <a class="text-link" href="./about/">进一步了解我 <span>↗</span></a>
          </div>
        </div>
        <div class="hero-signature" aria-hidden="true"><span>五</span><i></i><small>EST. 2026</small></div>
      </section>

      <section class="featured-section page-width">
        <div class="section-header">
          <div><p class="eyebrow">FEATURED / 置顶文章</p><h2>从这里开始</h2></div>
          <a class="quiet-button" href="./blog/">浏览全部文章 ↗</a>
        </div>
        <div id="featured-post"></div>
      </section>

      <section class="latest-section page-width">
        <div class="section-header">
          <div><p class="eyebrow">LATEST WRITING / 最近更新</p><h2>新写下的内容</h2></div>
          <p class="section-note">不定期更新。写设计，也写正在形成的生活方法。</p>
        </div>
        <div class="post-grid" id="latest-posts"></div>
      </section>

      <section class="topics-section page-width">
        <div><p class="eyebrow">TOPICS / 主题</p><h2>按照兴趣进入</h2></div>
        <div class="topic-cloud" id="topic-cloud"></div>
      </section>

      <section class="home-about page-width">
        <div class="profile-portrait" aria-hidden="true"><span>z</span><i></i><i></i></div>
        <div>
          <p class="eyebrow">ABOUT THE AUTHOR / 关于我</p>
          <h2 id="profile-name"></h2>
          <p class="profile-role" id="profile-role"></p>
          <p class="profile-bio" id="profile-bio"></p>
          <div class="profile-status"><span></span><p id="profile-status"></p></div>
          <a class="solid-button" href="./about/">阅读完整介绍</a>
        </div>
      </section>

      <section class="newsletter page-width">
        <div>
          <p class="eyebrow">FOLLOW ALONG / 保持联系</p>
          <h2>不想依赖算法，<br />就从一个地址开始。</h2>
        </div>
        <div class="newsletter-actions">
          <p>你可以通过 RSS 订阅更新，或者偶尔回来看看。这里不会有弹窗，也不会追踪你的阅读习惯。</p>
          <a class="solid-button" href="./rss.xml">订阅 RSS</a>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <dialog class="search-dialog" id="search-dialog">
      <form method="dialog" class="search-top"><label for="global-search">搜索文章</label><button aria-label="关闭搜索">关闭</button></form>
      <input id="global-search" type="search" placeholder="输入标题、分类或标签……" autocomplete="off" />
      <div id="global-search-results" class="search-results"></div>
    </dialog>
    <script type="module" src="./site.js"></script>
  </body>
</html>
