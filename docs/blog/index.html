<!doctype html>
<html lang="zh-CN" data-base="..">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="五等分的zako的全部文章。" />
    <link rel="icon" href="../favicon.svg" />
    <link rel="stylesheet" href="../styles.css" />
    <title>文章｜五等分的zako</title>
  </head>
  <body data-page="blog">
    <div class="site-backdrop" aria-hidden="true"><span></span><span></span><span></span></div>
    <header id="site-header"></header>
    <main class="page-width inner-main">
      <section class="page-intro">
        <p class="eyebrow">WRITING / 文章</p>
        <h1>把思考整理成<br />可以再次进入的文字。</h1>
        <p>这里收录设计观察、建站手记、数字生活与个人成长。你可以搜索，也可以从标签开始。</p>
      </section>
      <section class="filter-bar" aria-label="文章筛选">
        <label><span>搜索</span><input id="post-search" type="search" placeholder="标题、摘要或标签" /></label>
        <div class="filter-tags" id="category-filters"></div>
      </section>
      <section><p class="result-count" id="result-count"></p><div class="post-list" id="all-posts"></div></section>
    </main>
    <footer id="site-footer"></footer>
    <dialog class="search-dialog" id="search-dialog"><form method="dialog" class="search-top"><label for="global-search">搜索文章</label><button aria-label="关闭搜索">关闭</button></form><input id="global-search" type="search" placeholder="输入标题、分类或标签……" autocomplete="off" /><div id="global-search-results" class="search-results"></div></dialog>
    <script type="module" src="../site.js"></script>
  </body>
</html>
